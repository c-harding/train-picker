  <rect x="11" y="15" width="42" height="34" rx="8" fill="none" stroke="#f3ecd2" stroke-width="4"/>
  <path d="M37.79 25.11 A9 9 0 1 0 37.79 38.89" fill="none" stroke="#f3ecd2" stroke-width="4"/>
</svg>
